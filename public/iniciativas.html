<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board de Iniciativas — Dysrupcion</title>
  <link rel="stylesheet" href="/css/design-system.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="page">
    <section class="page-header">
      <div class="page-header-row">
        <h1 class="display-md">Iniciativas de la comunidad</h1>
        <a href="/enviar-iniciativa.html" class="btn btn-primary">Publicar mi iniciativa</a>
      </div>
      <p class="body-lg text-muted">Proyectos que la comunidad de Dysrupción ya está construyendo en Yucatán.</p>
    </section>

    <section class="filter-bar">
      <button class="filter-btn active" data-track="todas">Todas</button>
      <button class="filter-btn" data-track="Eventos">Eventos</button>
      <button class="filter-btn" data-track="Educacion">Educación</button>
      <button class="filter-btn" data-track="Emprendimiento">Emprendimiento</button>
      <button class="filter-btn" data-track="Impacto Local">Impacto Local</button>
      <button class="filter-btn" data-track="Puente">Puente</button>
    </section>

    <div id="initiatives-list" class="initiatives-grid">
      <p class="empty-state">Aun no hay iniciativas en este track.</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/layout.js"></script>
  <script src="/js/initiatives.js"></script>
</body>
</html>
